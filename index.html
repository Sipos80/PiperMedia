<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Piper Media | Egyedi Zeneszerzés & Videógyártás</title>

  <!-- Montserrat Betűtípus behívása -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;700;800&display=swap" rel="stylesheet">

  <!-- Stíluslap behívása -->
  <link rel="stylesheet" href="main.css">
</head>
<body>

  <!-- Fejléc -->
  <header>
    <div class="nav-container">
      <div class="logo">PIPER MEDIA</div>
    </div>
  </header>

  <!-- Fő tartalom kártyával -->
  <main style="padding: 4rem 2rem; max-width: 900px; margin: 0 auto;">
    
    <h1 style="text-align: center; margin-bottom: 2rem; color: #fff;">Videó Lejátszó Teszt</h1>

    <!-- VIDEÓ KÁRTYA -->
    <div class="video-card" data-video-id="bHW7389uW0Y" data-title="Filmzene - Bridgerton">
      <div class="thumbnail-wrapper">
        <img src="https://img.youtube.com/vi/bHW7389uW0Y/hqdefault.jpg" alt="Videó borítókép">
        <div class="play-btn">
          <svg viewBox="0 0 24 24" width="32" height="32"><path fill="#000" d="M8 5v14l11-7z"/></svg>
        </div>
      </div>
      <div class="card-body" style="padding: 1.5rem;">
        <h3 class="card-title" style="margin-bottom: 0.5rem; color: #fff;">Bridgerton</h3>
        <p class="card-text" style="color: #aaa;">Egyedi zeneszerzés a Bridgerton sorozat egyik jelenetéhez.</p>
      </div>
    </div>

  </main>

<!-- ==========================================
       MINIMÁL FULLSCREEN LIGHTBOX
       ========================================== -->
  <div id="videoModal" class="video-modal">
    <div class="modal-backdrop"></div>
    <div class="modal-content">
      <div class="responsive-iframe">
        <iframe id="modalIframe" src="" title="Video Player" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
      </div>
    </div>
  </div>

  <!-- JavaScript modulok behívása -->
  <script src="js/lightbox.js"></script>
  <script src="js/video-cards.js"></script>
</body>
</html>
