<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Piper Media | Egyedi Zeneszerzés & Videógyártás</title>

  <!-- Montserrat Betűtípus behívása -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;700;800&display=swap" rel="stylesheet">

  <!-- Stíluslap behívása -->
  <link rel="stylesheet" href="main.css">
</head>
<body>

  <!-- Fejléc -->
  <header>
    <div class="nav-container">
      <div class="logo">P I P E R   M E D I A</div>
    </div>
  </header>

  <!-- Fő tartalom -->
  <main class="container">
    
    <h1 class="section-title">A referencia videóink</h1>

    <!-- DINAMIKUS VIDEÓ RÁCS (A js/video-cards.js ide szúrja be a kártyákat) -->
    <div id="videoGrid" class="video-grid"></div>

  </main>

  <!-- FULLSCREEN LIGHTBOX MODAL -->
  <div id="videoModal" class="video-modal">
    <div class="modal-backdrop"></div>
    <div class="modal-content">
      <div class="responsive-iframe">
        <iframe id="modalIframe" src="" title="Video Player" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
      </div>
    </div>
  </div>

  <!-- JavaScript modulok behívása -->
  <script src="js/lightbox.js"></script>
  <script src="js/video-cards.js"></script>
</body>
</html>
